name: LinkedIn Profile SEO Optimizer

on:
  workflow_dispatch:
  # Run quarterly to keep content fresh
  schedule:
    - cron: "0 9 1 */3 *"  # 9AM on 1st of every 3rd month

jobs:
  optimize-linkedin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check API key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "❌ ANTHROPIC_API_KEY secret is not set"
            exit 1
          fi
          echo "✅ ANTHROPIC_API_KEY is set"

      - name: Install dependencies
        run: |
          cd seo-agent
          npm install

      - name: Run LinkedIn Profile SEO Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd seo-agent
          npm run linkedin 2>&1 | tee ../linkedin-agent-log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ LinkedIn agent exited with code $EXIT_CODE"
            exit 1
          fi

      - name: Commit optimization report
        run: |
          git config user.name "Innovate Digital SEO Bot"
          git config user.email "seo-bot@innovatedigital.ae"
          git add seo-agent/linkedin-profile-optimized.md || true
          git diff --staged --quiet || git commit -m "docs: linkedin profile optimization $(date '+%Y-%m-%d')"
          git push || true

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-profile-optimized
          path: seo-agent/linkedin-profile-optimized.md
          retention-days: 90
